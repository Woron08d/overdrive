<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — OverDrive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">
        <span class="logo__mark">OD</span>
        <span>OverDrive</span>
      </a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="players.html">Игроки</a>
        <a href="teams.html">Команды</a>
        <a id="navAccount" href="login.html">Вход</a>
      </nav>
    </div>
  </header>

  <div class="container breadcrumbs">
    <a href="index.html">Главная</a><span>/</span>Регистрация
  </div>

  <main class="container">
    <div class="form-card fade-in">
      <h1>Регистрация</h1>

      <div class="message message--error" id="formMessage"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="nickname">Никнейм</label>
          <input class="input" type="text" id="nickname" placeholder="например, alexey_awp" maxlength="50" required>
        </div>

        <div class="field">
          <label for="email">Электронная почта</label>
          <input class="input" type="email" id="email" placeholder="name@mail.ru" maxlength="100" required>
        </div>

        <div class="field">
          <label for="password">Пароль (не короче 6 символов)</label>
          <input class="input" type="password" id="password" placeholder="••••••" required>
        </div>

        <div class="field">
          <label for="role">Кто вы</label>
          <select class="select" id="role">
            <option value="player">Игрок — ищу команду</option>
            <option value="team">Команда — ищу игроков</option>
          </select>
        </div>

        <!-- Поля анкеты игрока: показываются только для роли «Игрок» -->
        <div id="playerFields">
          <div class="form-row">
            <div class="field">
              <label for="game_role">Игровая роль</label>
              <select class="select" id="game_role">
                <option>AWP</option>
                <option selected>Rifler</option>
                <option>Entry</option>
                <option>Support</option>
                <option>Lurker</option>
                <option>IGL</option>
              </select>
            </div>
            <div class="field">
              <label for="region">Регион</label>
              <select class="select" id="region">
                <option selected>СНГ</option>
                <option>Европа</option>
                <option>Азия</option>
                <option>Америка</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="elo">Рейтинг ELO</label>
            <input class="input" type="number" id="elo" value="1000" min="0" max="5000">
          </div>
        </div>

        <button class="button" type="submit" id="submitButton">Зарегистрироваться</button>
      </form>

      <p class="form-hint">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div><b>OverDrive</b> — учебный проект, УП.08</div>
      <div>Связь: <a href="mailto:overdrive@mail.ru">overdrive@mail.ru</a></div>
    </div>
  </footer>

  <script src="common.js"></script>
  <script src="register.js"></script>
</body>
</html>
