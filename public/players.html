<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог игроков — OverDrive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">
        <span class="logo__mark">OD</span>
        <span>OverDrive</span>
      </a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="players.html">Игроки</a>
        <a href="teams.html">Команды</a>
        <a id="navAccount" href="login.html">Вход</a>
      </nav>
    </div>
  </header>

  <div class="container breadcrumbs">
    <a href="index.html">Главная</a><span>/</span>Игроки
  </div>

  <main class="container">
    <div class="section__head">
      <h1>Каталог игроков</h1>
      <a class="button button--ghost" href="account.html">Личный кабинет</a>
    </div>

    <!-- Панель фильтров и поиска (задание 5 практики) -->
    <div class="filters">
      <div class="field">
        <label for="search">Поиск по никнейму</label>
        <input class="input" type="text" id="search" placeholder="например, alex">
      </div>

      <div class="field">
        <label for="roleFilter">Игровая роль</label>
        <select class="select" id="roleFilter">
          <option value="all">Все роли</option>
          <option>AWP</option>
          <option>Rifler</option>
          <option>Entry</option>
          <option>Support</option>
          <option>Lurker</option>
          <option>IGL</option>
        </select>
      </div>

      <div class="field">
        <label for="regionFilter">Регион</label>
        <select class="select" id="regionFilter">
          <option value="all">Все регионы</option>
          <option>СНГ</option>
          <option>Европа</option>
          <option>Азия</option>
          <option>Америка</option>
        </select>
      </div>

      <div class="field">
        <label for="sortFilter">Сортировка</label>
        <select class="select" id="sortFilter">
          <option value="elo_desc">ELO: сначала выше</option>
          <option value="elo_asc">ELO: сначала ниже</option>
          <option value="nickname">По никнейму (А-Я)</option>
        </select>
      </div>

      <div class="field">
        <label for="lookFilter">Статус</label>
        <select class="select" id="lookFilter">
          <option value="all">Все</option>
          <option value="team">Ищут команду</option>
        </select>
      </div>

      <button class="button button--ghost button--small" type="button" id="resetButton">Сбросить</button>
    </div>

    <div class="filters__count" id="countText">Загружаем игроков...</div>
    <div class="grid" id="players"></div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div><b>OverDrive</b> — учебный проект, УП.08</div>
      <div>Связь: <a href="mailto:overdrive@mail.ru">overdrive@mail.ru</a></div>
    </div>
  </footer>

  <script src="common.js"></script>
  <script src="players.js"></script>
</body>
</html>
