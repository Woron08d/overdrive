<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Команды — OverDrive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">
        <span class="logo__mark">OD</span>
        <span>OverDrive</span>
      </a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="players.html">Игроки</a>
        <a href="teams.html">Команды</a>
        <a id="navAccount" href="login.html">Вход</a>
      </nav>
    </div>
  </header>

  <div class="container breadcrumbs">
    <a href="index.html">Главная</a><span>/</span>Команды
  </div>

  <main class="container">
    <div class="section__head">
      <h1>Команды</h1>
    </div>

    <div class="filters">
      <div class="field">
        <label for="teamSearch">Поиск по названию</label>
        <input class="input" type="text" id="teamSearch" placeholder="например, Phoenix">
      </div>
      <div class="field">
        <label for="teamRegion">Регион</label>
        <select class="select" id="teamRegion">
          <option value="all">Все регионы</option>
          <option>СНГ</option>
          <option>Европа</option>
        </select>
      </div>
    </div>

    <div class="filters__count" id="teamCount">Загружаем команды...</div>
    <div class="grid" id="teams"></div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div><b>OverDrive</b> — учебный проект, УП.08</div>
      <div>Связь: <a href="mailto:overdrive@mail.ru">overdrive@mail.ru</a></div>
    </div>
  </footer>

  <script src="common.js"></script>
  <script src="teams.js"></script>
</body>
</html>
