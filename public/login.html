<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — OverDrive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">
        <span class="logo__mark">OD</span>
        <span>OverDrive</span>
      </a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="players.html">Игроки</a>
        <a href="teams.html">Команды</a>
        <a id="navAccount" href="login.html">Вход</a>
      </nav>
    </div>
  </header>

  <div class="container breadcrumbs">
    <a href="index.html">Главная</a><span>/</span>Вход
  </div>

  <main class="container">
    <div class="form-card fade-in">
      <h1>Вход в систему</h1>

      <div class="message message--error" id="formMessage"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="nickname">Никнейм или почта</label>
          <input class="input" type="text" id="nickname" placeholder="alexey_awp" required>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <input class="input" type="password" id="password" placeholder="••••••" required>
        </div>

        <button class="button" type="submit" id="submitButton">Войти</button>
      </form>

      <p class="form-hint">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
      </p>
      <p class="form-hint">
        Тестовый вход: <b>alexey_awp</b> / <b>password123</b>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div><b>OverDrive</b> — учебный проект, УП.08</div>
      <div>Связь: <a href="mailto:overdrive@mail.ru">overdrive@mail.ru</a></div>
    </div>
  </footer>

  <script src="common.js"></script>
  <script src="login.js"></script>
</body>
</html>
